<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep - Study Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .nav-link {
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        .nav-link.active {
            background-color: rgba(59, 130, 246, 0.2);
            border-left: 4px solid #3b82f6;
        }

        .card-section {
            display: none;
        }

        .card-section.active {
            display: block;
        }

        [contenteditable="true"] {
            cursor: text;
            border-radius: 3px;
        }

        [contenteditable="true"]:hover {
            background-color: rgba(59, 130, 246, 0.05);
            outline: 1px dashed rgba(59, 130, 246, 0.4);
            outline-offset: 2px;
        }

        [contenteditable="true"]:focus {
            background-color: rgba(59, 130, 246, 0.08);
            outline: 2px solid rgba(59, 130, 246, 0.7);
            outline-offset: 2px;
        }

        #notesEditor {
            display: none;
        }

        .note-item {
            cursor: pointer;
            transition: all 0.2s;
        }

        .note-item:hover {
            background-color: rgba(59, 130, 246, 0.05);
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="flex h-full">

        <!-- Sidebar Navigation -->
        <nav class="w-80 bg-white shadow-lg overflow-y-auto flex-shrink-0">
            <div class="p-6 bg-gradient-to-r from-blue-600 to-blue-700">
                <h1 class="text-white text-xl font-bold">Interview Prep</h1>
                <p class="text-blue-100 text-sm mt-1">Study Guide</p>
                <div class="mt-3 flex gap-2">
                    <button onclick="exportJSON()"
                        class="text-xs bg-white text-blue-700 font-semibold px-3 py-1 rounded hover:bg-blue-50">Export
                        JSON</button>
                    <button onclick="resetAll()"
                        class="text-xs bg-blue-500 text-white font-semibold px-3 py-1 rounded hover:bg-blue-400 border border-blue-400">Reset</button>
                </div>
                <div id="saveStatus" class="mt-2 text-xs text-blue-200 min-h-[1.2em]"></div>
            </div>
            <div class="p-4">
                <div id="navLinks" class="space-y-2">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-auto bg-white" id="mainContent">

            <!-- Card sections rendered by JS -->
            <div id="cardsContainer"></div>

            <!-- Notes Editor -->
            <div id="notesEditor" class="min-h-full overflow-auto p-8 bg-white">
                <div class="max-w-4xl mx-auto">
                    <h1 class="text-2xl font-bold text-blue-900 mb-4 border-b-2 border-blue-600 pb-2">Interview Notes</h1>
                    <div class="mb-4 flex gap-2">
                        <button id="newNoteBtn" onclick="newNote()"
                            class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">New Note</button>
                    </div>
                    <div class="mb-2">
                        <label for="noteTitle" class="block text-sm font-semibold text-gray-700 mb-1">Note Title</label>
                        <input type="text" id="noteTitle"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Enter note title to save it in the list..." oninput="autoSaveNote()">
                    </div>
                    <div class="mb-2 text-sm text-gray-600" id="noteStatus">
                        <span class="text-green-600">● Saved</span>
                    </div>
                    <textarea id="noteContent"
                        class="w-full h-80 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Type your interview notes here..." oninput="autoSaveNote()"></textarea>
                    <div class="mt-6">
                        <h2 class="text-lg font-semibold text-gray-800 mb-3">Saved Notes</h2>
                        <div id="savedNotesList" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-2xl mx-4">
            <h2 class="text-lg font-bold text-gray-900 mb-1">Current Cards JSON</h2>
            <p class="text-sm text-gray-500 mb-3">Copy this and paste it into <code class="bg-gray-100 px-1 rounded">cards.js</code> as the new <code class="bg-gray-100 px-1 rounded">CARDS_DEFAULT</code> value.</p>
            <textarea id="exportTextarea"
                class="w-full h-64 p-3 border border-gray-200 rounded font-mono text-xs bg-gray-50 resize-none"
                readonly></textarea>
            <div class="mt-3 flex gap-2 justify-end">
                <button onclick="copyExport()" id="copyBtn"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">Copy to
                    Clipboard</button>
                <button onclick="closeExport()"
                    class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 text-sm font-medium">Close</button>
            </div>
        </div>
    </div>

    <!-- Cards data loaded as a classic script — works on file:// without a server -->
    <script src="cards.js"></script>

    <script>
        // ═══════════════════════════════════════════════════════════════════
        // STORAGE
        // ═══════════════════════════════════════════════════════════════════
        const CARDS_KEY = 'interviewPrepCards';
        const NOTES_KEY = 'interviewNotes';

        function loadCards() {
            const saved = localStorage.getItem(CARDS_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { }
            }
            return deepClone(CARDS_DEFAULT);
        }

        function deepClone(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        function collectFromDOM() {
            const cards = loadCards();
            cards.forEach(card => {
                const section = document.querySelector(`[data-card-id="${card.id}"]`);
                if (!section) return;

                const headingEl = section.querySelector('[data-field="heading"]');
                if (headingEl) card.heading = headingEl.textContent.trim();

                section.querySelectorAll('[data-field="point"]').forEach((el, i) => {
                    if (card.points[i] !== undefined) card.points[i] = el.textContent.trim();
                });

                if (card.sidebar) {
                    const titleEl = section.querySelector('[data-field="sidebar-title"]');
                    if (titleEl) card.sidebar.title = titleEl.textContent.trim();

                    section.querySelectorAll('[data-field="sidebar-label"]').forEach((el, i) => {
                        if (card.sidebar.items[i]) card.sidebar.items[i].label = el.textContent.trim();
                    });

                    section.querySelectorAll('[data-field="sidebar-text"]').forEach((el, i) => {
                        if (card.sidebar.items[i]) card.sidebar.items[i].text = el.textContent.trim();
                    });
                }

                if (card.quote) {
                    const qtEl = section.querySelector('[data-field="quote-text"]');
                    if (qtEl) card.quote.text = qtEl.textContent.trim();
                    const qnEl = section.querySelector('[data-field="quote-note"]');
                    if (qnEl) card.quote.note = qnEl.textContent.trim();
                }
            });
            return cards;
        }

        function persistCards() {
            const data = collectFromDOM();
            localStorage.setItem(CARDS_KEY, JSON.stringify(data));
        }

        // ═══════════════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════════════
        function esc(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderNav(cards) {
            const container = document.getElementById('navLinks');
            const notesItem = `
                <a onclick="showNotes()" class="nav-link block p-3 rounded-lg text-sm" data-page="notes">
                    <div class="font-semibold text-blue-900">Notes</div>
                    <div class="text-xs text-gray-600 mt-1">Notes taken during an interview</div>
                </a>`;

            container.innerHTML = cards.map(card => `
                <a onclick="showCard(${card.id})" class="nav-link block p-3 rounded-lg text-sm" data-page="card-${card.id}">
                    <div class="font-semibold text-blue-900">${esc(card.navLabel)}</div>
                    <div class="text-xs text-gray-600 mt-1">${esc(card.navSubtitle)}</div>
                </a>
            `).join('') + notesItem;
        }

        function renderCards(cards) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = cards.map(card => renderCard(card)).join('');
        }

        function renderCard(card) {
            const c = card.color;

            const pointsHtml = card.points.map((point, i) =>
                `<li data-field="point" data-index="${i}" contenteditable="true">${esc(point)}</li>`
            ).join('');

            let sidebarHtml = '';
            if (card.sidebar) {
                const itemsHtml = card.sidebar.items.map((item, i) => {
                    if (item.label) {
                        return `<li>
                            <strong><span data-field="sidebar-label" data-index="${i}" contenteditable="true">${esc(item.label)}</span>:</strong>
                            <span data-field="sidebar-text" data-index="${i}" contenteditable="true">${esc(item.text)}</span>
                        </li>`;
                    }
                    return `<li data-field="sidebar-text" data-index="${i}" contenteditable="true">${esc(item.text)}</li>`;
                }).join('');

                sidebarHtml = `
                    <div class="bg-white p-3 rounded border-l-4 border-${c}-400 mt-4">
                        <h3 class="text-sm font-semibold text-gray-700 mb-2"
                            data-field="sidebar-title" contenteditable="true">${esc(card.sidebar.title)}</h3>
                        <ul class="space-y-1 ml-4 list-disc text-gray-700 text-sm">
                            ${itemsHtml}
                        </ul>
                    </div>`;
            }

            let quoteHtml = '';
            if (card.quote) {
                quoteHtml = `
                    <div class="bg-${c}-50 p-3 rounded border border-${c}-200 mt-2">
                        <p class="text-sm text-${c}-800 italic"
                            data-field="quote-text" contenteditable="true">${esc(card.quote.text)}</p>
                        <p class="text-xs text-${c}-600 mt-1"
                            data-field="quote-note" contenteditable="true">${esc(card.quote.note)}</p>
                    </div>`;
            }

            return `
                <div class="card-section p-8" data-card-id="${card.id}">
                    <div class="max-w-4xl mx-auto">
                        <h1 class="text-2xl font-bold text-${c}-900 mb-4 border-b-2 border-${c}-600 pb-2"
                            data-field="heading" contenteditable="true">${esc(card.heading)}</h1>
                        <div class="text-gray-800 text-base leading-relaxed space-y-4">
                            <ol class="list-inside space-y-2 ml-4 list-decimal">
                                ${pointsHtml}
                            </ol>
                            ${sidebarHtml}
                            ${quoteHtml}
                        </div>
                    </div>
                </div>`;
        }

        // ═══════════════════════════════════════════════════════════════════
        // NAVIGATION
        // ═══════════════════════════════════════════════════════════════════
        function setActiveNav(page) {
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const target = document.querySelector(`[data-page="${page}"]`);
            if (target) target.classList.add('active');
        }

        function showCard(id) {
            document.querySelectorAll('.card-section').forEach(el => el.classList.remove('active'));
            document.getElementById('notesEditor').style.display = 'none';

            const section = document.querySelector(`[data-card-id="${id}"]`);
            if (section) section.classList.add('active');

            setActiveNav(`card-${id}`);
            document.getElementById('mainContent').scrollTop = 0;

            const url = new URL(window.location);
            url.searchParams.set('page', `card-${id}`);
            url.searchParams.delete('note_id');
            window.history.replaceState({}, '', url);
        }

        function showNotes() {
            document.querySelectorAll('.card-section').forEach(el => el.classList.remove('active'));
            document.getElementById('notesEditor').style.display = 'block';
            setActiveNav('notes');

            const url = new URL(window.location);
            url.searchParams.set('page', 'notes');
            url.searchParams.delete('note_id');
            window.history.replaceState({}, '', url);

            newNote();
            renderSavedNotes();
        }

        // ═══════════════════════════════════════════════════════════════════
        // EDIT → SAVE
        // ═══════════════════════════════════════════════════════════════════
        let saveTimeout;

        function setSaveStatus(state) {
            const el = document.getElementById('saveStatus');
            if (state === 'saving') el.textContent = '● Saving...';
            else if (state === 'saved') el.textContent = '● Saved';
            else el.textContent = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('mainContent').addEventListener('input', e => {
                if (e.target.hasAttribute('data-field')) {
                    setSaveStatus('saving');
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        persistCards();
                        setSaveStatus('saved');
                        setTimeout(() => setSaveStatus(''), 2000);
                    }, 300);
                }
            });
        });

        // Prevent contenteditable from inserting <div> on Enter
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && e.target.hasAttribute('data-field')) {
                e.preventDefault();
            }
        });

        // ═══════════════════════════════════════════════════════════════════
        // EXPORT / RESET
        // ═══════════════════════════════════════════════════════════════════
        function exportJSON() {
            const current = collectFromDOM();
            document.getElementById('exportTextarea').value = JSON.stringify(current, null, 4);
            document.getElementById('exportModal').classList.remove('hidden');
            document.getElementById('copyBtn').textContent = 'Copy to Clipboard';
        }

        function closeExport() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function copyExport() {
            const ta = document.getElementById('exportTextarea');
            navigator.clipboard.writeText(ta.value).then(() => {
                document.getElementById('copyBtn').textContent = 'Copied!';
                setTimeout(() => {
                    document.getElementById('copyBtn').textContent = 'Copy to Clipboard';
                }, 2000);
            }).catch(() => {
                ta.select();
                document.execCommand('copy');
            });
        }

        function resetAll() {
            if (!confirm('Reset all edits to the original content? This cannot be undone.')) return;
            localStorage.removeItem(CARDS_KEY);
            renderCards(deepClone(CARDS_DEFAULT));
            setSaveStatus('saved');
            setTimeout(() => setSaveStatus(''), 2000);
        }

        // Close export modal on backdrop click
        document.addEventListener('click', e => {
            const modal = document.getElementById('exportModal');
            if (e.target === modal) closeExport();
        });

        // ═══════════════════════════════════════════════════════════════════
        // NOTES SYSTEM
        // ═══════════════════════════════════════════════════════════════════
        let currentNoteId = null;
        let notesSaveTimeout = null;

        function generateId() {
            return 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function getNotesData() {
            const data = localStorage.getItem(NOTES_KEY);
            if (!data) return { notes: {} };
            const parsed = JSON.parse(data);
            if (parsed.saved && !parsed.notes) {
                const migrated = { notes: {} };
                Object.entries(parsed.saved).forEach(([title, note]) => {
                    const id = generateId();
                    migrated.notes[id] = { id, title, content: note.content || '', created: note.created || Date.now(), lastModified: note.lastModified || Date.now() };
                });
                saveNotesData(migrated);
                return migrated;
            }
            return parsed;
        }

        function saveNotesData(data) {
            localStorage.setItem(NOTES_KEY, JSON.stringify(data));
        }

        function showNoteStatus(state) {
            const el = document.getElementById('noteStatus');
            if (state === 'saving') {
                el.style.visibility = 'visible';
                el.innerHTML = '<span class="text-orange-500">● Updating...</span>';
            } else if (state === 'saved') {
                if (!currentNoteId) { el.style.visibility = 'hidden'; return; }
                el.style.visibility = 'visible';
                const data = getNotesData();
                const ts = data.notes[currentNoteId]?.lastModified || Date.now();
                el.innerHTML = `<span class="text-green-600">● Saved</span> - ${new Date(ts).toLocaleString()}`;
            } else {
                el.style.visibility = 'hidden';
            }
        }

        function updateNewNoteBtn() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            document.getElementById('newNoteBtn').style.visibility = (!title && !content) ? 'hidden' : 'visible';
        }

        function formatAutoTitle() {
            return `Untitled - ${new Date().toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true })}`;
        }

        function setNoteTitleInput(title) {
            if (title && title.startsWith('Untitled - ')) return;
            document.getElementById('noteTitle').value = title || '';
        }

        function autoSaveNote() {
            showNoteStatus('saving');
            updateNewNoteBtn();
            if (notesSaveTimeout) clearTimeout(notesSaveTimeout);
            notesSaveTimeout = setTimeout(() => {
                let title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value;
                const data = getNotesData();
                const now = Date.now();
                if (!content.trim() && !title) {
                    if (currentNoteId && data.notes[currentNoteId]) {
                        data.notes[currentNoteId].title = formatAutoTitle();
                        data.notes[currentNoteId].content = content;
                        data.notes[currentNoteId].lastModified = now;
                        saveNotesData(data);
                        renderSavedNotes();
                    }
                    showNoteStatus('');
                    return;
                }
                if (!title) title = formatAutoTitle();
                if (!currentNoteId) currentNoteId = generateId();
                if (!data.notes[currentNoteId]) {
                    data.notes[currentNoteId] = { id: currentNoteId, title, content, created: now, lastModified: now };
                } else {
                    Object.assign(data.notes[currentNoteId], { title, content, lastModified: now });
                }
                saveNotesData(data);
                showNoteStatus('saved');
                renderSavedNotes();
                updateNewNoteBtn();
            }, 150);
        }

        function newNote() {
            setNoteTitleInput('');
            document.getElementById('noteContent').value = '';
            currentNoteId = null;
            showNoteStatus('saved');
            updateNewNoteBtn();
        }

        function loadNote(noteId) {
            const data = getNotesData();
            const note = data.notes[noteId];
            if (!note) return;
            setNoteTitleInput(note.title);
            document.getElementById('noteContent').value = note.content || '';
            currentNoteId = noteId;
            showNoteStatus('saved');
            updateNewNoteBtn();
        }

        function deleteNote(noteId) {
            const data = getNotesData();
            const noteTitle = data.notes[noteId]?.title || 'this note';
            if (!confirm(`Delete "${noteTitle}"?`)) return;
            delete data.notes[noteId];
            saveNotesData(data);
            renderSavedNotes();
            if (currentNoteId === noteId) newNote();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderSavedNotes() {
            const data = getNotesData();
            const container = document.getElementById('savedNotesList');
            const titled = Object.values(data.notes).filter(n => n.title?.trim());
            if (titled.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No saved notes yet. Add a title to your note to save it here.</p>';
                return;
            }
            container.innerHTML = titled
                .sort((a, b) => b.lastModified - a.lastModified)
                .map(note => `
                    <div class="note-item p-3 border border-gray-200 rounded-lg flex justify-between items-start">
                        <div onclick="loadNote('${note.id}')">
                            <div class="font-semibold text-blue-900">${escapeHtml(note.title)}</div>
                            <div class="text-xs text-gray-600 mt-1">Last modified: ${new Date(note.lastModified).toLocaleString()}</div>
                            <div class="text-sm text-gray-700 mt-1 truncate">${escapeHtml((note.content || '').substring(0, 100))}...</div>
                        </div>
                        <button onclick="deleteNote('${note.id}')" class="text-red-600 hover:text-red-800 text-sm ml-2">Delete</button>
                    </div>
                `).join('');
        }

        // ═══════════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════════
        (function init() {
            const cards = loadCards();
            renderNav(cards);
            renderCards(cards);

            const params = new URLSearchParams(window.location.search);
            const page = params.get('page');

            if (page === 'notes') {
                showNotes();
            } else if (page && page.startsWith('card-')) {
                const id = parseInt(page.replace('card-', ''), 10);
                showCard(id);
            } else {
                showCard(1);
            }
        })();
    </script>
</body>

</html>
